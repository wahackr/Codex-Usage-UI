name: CI

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.22.1'
  DOTNET_VERSION: '8.0.x'

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate tray icon
        run: npm run generate:icon

      - name: Run tests
        run: npm test

  winui:
    name: WinUI 3 build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore winui/CodexUsageWidget.sln

      # The WinUI app project only compiles on Windows (the XAML compiler is a
      # Windows executable), so the whole solution builds here instead of Core.
      - name: Build
        run: dotnet build winui/CodexUsageWidget.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test winui/tests/CodexUsageWidget.Tests/CodexUsageWidget.Tests.csproj -c Release --no-build

      # MarkupCompilePass2 fails with only "XamlCompiler.exe ... exited with
      # code 1". The compiler runs out of proc and returns 1 before writing
      # output.json, so its diagnostics never reach the log (the event log
      # confirms it is a clean return, not a crash). Pass 1 is clean and every
      # input pass 2 asks for is on disk, so bisect instead: flip the settings
      # that change what pass 2 is asked to do, then rebuild copies of the
      # project with one half of the XAML swapped for a stub.
      - name: Bisect the XAML compile failure
        if: failure()
        shell: pwsh
        run: |
          function Try-Build {
            param([string]$Label, [string]$Project, [string[]]$Extra = @())
            "==== $Label ===="
            $out = @(& dotnet build $Project -c Release --no-restore @Extra 2>&1)
            "exit: $LASTEXITCODE"
            $out | Where-Object { "$_" -match 'error|Build succeeded' } |
              Select-Object -First 12 | ForEach-Object { "  $_" }
          }

          # A copy keeps the same relative layout (src/, assets/) so the project
          # references and the tray-icon Content glob still resolve.
          function New-Copy {
            param([string]$Name)
            $base = Join-Path $env:RUNNER_TEMP $Name
            Remove-Item -Recurse -Force $base -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $base | Out-Null
            Copy-Item -Recurse winui/src (Join-Path $base 'src')
            Copy-Item -Recurse winui/assets (Join-Path $base 'assets')
            Get-ChildItem $base -Recurse -Directory |
              Where-Object { $_.Name -in 'obj', 'bin' } | Remove-Item -Recurse -Force
            dotnet restore (Join-Path $base 'src/CodexUsageWidget/CodexUsageWidget.csproj') | Out-Null
            $base
          }

          $app = 'winui/src/CodexUsageWidget/CodexUsageWidget.csproj'
          Try-Build 'fingerprint off' $app @('-p:XAMLFingerprint=false')
          Try-Build 'winappsdk not self-contained' $app @('-p:WindowsAppSDKSelfContained=false')

          $full = New-Copy 'probe-full'
          $fullProj = Join-Path $full 'src/CodexUsageWidget/CodexUsageWidget.csproj'
          Try-Build 'copy: real App.xaml + real MainWindow.xaml' $fullProj

          Set-Content (Join-Path $full 'src/CodexUsageWidget/MainWindow.xaml') @'
          <Window x:Class="CodexUsageWidget.MainWindow"
                  xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
                  xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"
                  Title="Codex Usage">
            <Grid />
          </Window>
          '@
          Set-Content (Join-Path $full 'src/CodexUsageWidget/MainWindow.xaml.cs') @'
          using Microsoft.UI.Xaml;

          namespace CodexUsageWidget;

          public sealed partial class MainWindow : Window
          {
              public MainWindow() => InitializeComponent();
              public void ShowFromTray() => Activate();
          }
          '@
          'Tray', 'WindowMode', 'WindowBehaviors' |
            ForEach-Object { Remove-Item (Join-Path $full "src/CodexUsageWidget/MainWindow.$_.cs") }
          Try-Build 'copy: stub MainWindow.xaml' $fullProj

          $stubApp = New-Copy 'probe-stub-app'
          Set-Content (Join-Path $stubApp 'src/CodexUsageWidget/App.xaml') @'
          <Application x:Class="CodexUsageWidget.App"
                       xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
                       xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml">
            <Application.Resources />
          </Application>
          '@
          Try-Build 'copy: stub App.xaml' (Join-Path $stubApp 'src/CodexUsageWidget/CodexUsageWidget.csproj')
