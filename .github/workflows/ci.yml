name: CI

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]
  workflow_dispatch:
    inputs:
      package_windows:
        description: 'Build downloadable WinUI installer and portable ZIP'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.22.1'
  DOTNET_VERSION: '8.0.x'

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate tray icon
        run: npm run generate:icon

      - name: Run tests
        run: npm test

  winui:
    name: WinUI 3 build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # The Windows App SDK imports its PRI tasks from
      # $(MSBuildExtensionsPath)\Microsoft\VisualStudio\v$(VisualStudioVersion)\
      # AppxPackage\, which only exists inside a Visual Studio install. Under a
      # plain `dotnet build` that path is inside the dotnet SDK and the build
      # dies with MSB4062 on ExpandPriContent, so restore and build with the
      # runner's VS MSBuild instead.
      - uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild winui/CodexUsageWidget.sln -t:restore -nologo -v:minimal

      # The WinUI app project only compiles on Windows (the XAML compiler is a
      # Windows executable), so the whole solution builds here instead of Core.
      - name: Build
        run: msbuild winui/CodexUsageWidget.sln -p:Configuration=Release -nologo -v:minimal

      # The test project is plain net8.0 (it references Core, not the app), so
      # it still runs through dotnet test against the msbuild output.
      - name: Run tests
        run: dotnet test winui/tests/CodexUsageWidget.Tests/CodexUsageWidget.Tests.csproj -c Release --no-build

      - name: Report the AppxPackage task path
        if: failure()
        shell: pwsh
        run: |
          "dotnet SDKs: $((dotnet --list-sdks) -join '; ')"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          foreach ($vs in & $vswhere -all -products * -property installationPath) {
            "VS: $vs"
            Get-ChildItem "$vs\MSBuild\Microsoft\VisualStudio" -Recurse -ErrorAction SilentlyContinue -Filter 'Microsoft.Build.*.dll' |
              ForEach-Object { "  $($_.FullName)" }
          }

  package-winui:
    if: github.event_name == 'workflow_dispatch' && inputs.package_windows
    name: Package WinUI widget
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: microsoft/setup-msbuild@v2

      - name: Resolve version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore
        run: msbuild winui/src/CodexUsageWidget/CodexUsageWidget.csproj -t:restore -p:Configuration=Release -p:RuntimeIdentifier=win-x64 -p:SelfContained=true -nologo -v:minimal

      - name: Publish self-contained app
        shell: pwsh
        run: |
          msbuild winui/src/CodexUsageWidget/CodexUsageWidget.csproj `
            -t:Publish `
            -p:Configuration=Release `
            -p:RuntimeIdentifier=win-x64 `
            -p:SelfContained=true `
            -p:Version=$env:APP_VERSION `
            -p:PublishDir=$env:GITHUB_WORKSPACE\winui\publish\ `
            -nologo -v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package installer and portable app
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" winui/installer/setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item winui/installer/Output/*.exe artifacts/
          Compress-Archive -Path winui/publish/* -DestinationPath "artifacts/CodexUsageWidget-$env:APP_VERSION-win-x64-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: winui-windows-binaries
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
