name: CI

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.22.1'
  DOTNET_VERSION: '8.0.x'

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate tray icon
        run: npm run generate:icon

      - name: Run tests
        run: npm test

  winui:
    name: WinUI 3 build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore winui/CodexUsageWidget.sln

      # The WinUI app project only compiles on Windows (the XAML compiler is a
      # Windows executable), so the whole solution builds here instead of Core.
      - name: Build
        run: dotnet build winui/CodexUsageWidget.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test winui/tests/CodexUsageWidget.Tests/CodexUsageWidget.Tests.csproj -c Release --no-build

      # MarkupCompilePass2 fails with only "XamlCompiler.exe ... exited with
      # code 1" and writes no output.json, so its diagnostics never reach the
      # log. The copy bisect localised it: a stub MainWindow.xaml still fails,
      # a stub App.xaml gets past pass 2. Rebuild the copy with one construct
      # at a time removed from App.xaml to find what pass 2 chokes on.
      - name: Bisect the XAML compile failure
        if: failure()
        shell: pwsh
        run: |
          function Try-Build {
            param([string]$Label, [string]$Project, [string[]]$Extra = @())
            "==== $Label ===="
            $out = @(& dotnet build $Project -c Release --no-restore @Extra 2>&1)
            "exit: $LASTEXITCODE"
            $out | Where-Object { "$_" -match 'error|Build succeeded' } |
              Select-Object -First 12 | ForEach-Object { "  $_" }
          }

          # A copy keeps the same relative layout (src/, assets/) so the project
          # references and the tray-icon Content glob still resolve.
          function New-Copy {
            param([string]$Name)
            $base = Join-Path $env:RUNNER_TEMP $Name
            Remove-Item -Recurse -Force $base -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $base | Out-Null
            Copy-Item -Recurse winui/src (Join-Path $base 'src')
            Copy-Item -Recurse winui/assets (Join-Path $base 'assets')
            Get-ChildItem $base -Recurse -Directory |
              Where-Object { $_.Name -in 'obj', 'bin' } | Remove-Item -Recurse -Force
            dotnet restore (Join-Path $base 'src/CodexUsageWidget/CodexUsageWidget.csproj') | Out-Null
            $base
          }

          $full = New-Copy 'probe-full'
          $fullProj = Join-Path $full 'src/CodexUsageWidget/CodexUsageWidget.csproj'
          Try-Build 'copy: unmodified' $fullProj

          $appxaml = Join-Path $full 'src/CodexUsageWidget/App.xaml'
          $original = Get-Content $appxaml -Raw
          $variants = [ordered]@{
            'no TextBlock.Foreground setter' =
              $original -replace '<Setter Property="TextBlock\.Foreground"[^>]*/>', ''
            'no RadialGradientBrush' =
              $original -replace '(?s)<RadialGradientBrush.*?</RadialGradientBrush>', ''
            'no merged XamlControlsResources' =
              $original -replace '(?s)<ResourceDictionary\.MergedDictionaries>.*?</ResourceDictionary\.MergedDictionaries>', ''
            'no ThemeDictionaries' =
              $original -replace '(?s)<ResourceDictionary\.ThemeDictionaries>.*?</ResourceDictionary\.ThemeDictionaries>', ''
            'no Styles' =
              $original -replace '(?s)<Style .*?</Style>', ''
          }
          foreach ($name in $variants.Keys) {
            if ($variants[$name] -eq $original) { "==== copy: $name — pattern matched nothing ===="; continue }
            Set-Content $appxaml $variants[$name]
            Try-Build "copy: $name" $fullProj
          }

          $stub = New-Copy 'probe-stub-app'
          Set-Content (Join-Path $stub 'src/CodexUsageWidget/App.xaml') @'
          <Application x:Class="CodexUsageWidget.App"
                       xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"
                       xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml">
            <Application.Resources />
          </Application>
          '@
          Try-Build 'copy: stub App.xaml' (Join-Path $stub 'src/CodexUsageWidget/CodexUsageWidget.csproj')
