name: CI

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.22.1'
  DOTNET_VERSION: '8.0.x'

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate tray icon
        run: npm run generate:icon

      - name: Run tests
        run: npm test

  winui:
    name: WinUI 3 build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore winui/CodexUsageWidget.sln

      # The WinUI app project only compiles on Windows (the XAML compiler is a
      # Windows executable), so the whole solution builds here instead of Core.
      - name: Build
        run: dotnet build winui/CodexUsageWidget.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test winui/tests/CodexUsageWidget.Tests/CodexUsageWidget.Tests.csproj -c Release --no-build

      # The out-of-proc XamlCompiler.exe reports failures only as "exited with
      # code 1"; MSBuild never sees its diagnostics. Re-run the same compile
      # through the in-proc task so the real XAML errors reach the log.
      - name: Report XAML compiler diagnostics
        if: failure()
        shell: pwsh
        run: |
          dotnet build winui/src/CodexUsageWidget/CodexUsageWidget.csproj -c Release --no-restore `
            -p:UseXamlCompilerExecutable=false
          dotnet build winui/src/CodexUsageWidget/CodexUsageWidget.csproj -getItem:Page -getItem:ApplicationDefinition
          $output = 'winui/src/CodexUsageWidget/obj/Release/net8.0-windows10.0.19041.0/output.json'
          if (Test-Path $output) {
            '== XamlCompiler output.json =='
            Get-Content $output -Raw
          }
