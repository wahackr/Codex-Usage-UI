name: CI

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.22.1'
  DOTNET_VERSION: '8.0.x'

jobs:
  test:
    name: Unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate tray icon
        run: npm run generate:icon

      - name: Run tests
        run: npm test

  winui:
    name: WinUI 3 build and tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore winui/CodexUsageWidget.sln

      # The WinUI app project only compiles on Windows (the XAML compiler is a
      # Windows executable), so the whole solution builds here instead of Core.
      - name: Build
        run: dotnet build winui/CodexUsageWidget.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test winui/tests/CodexUsageWidget.Tests/CodexUsageWidget.Tests.csproj -c Release --no-build

      # MarkupCompilePass2 dies with only "XamlCompiler.exe ... exited with
      # code 1": the compiler runs out of proc, MSBuild aborts on the Exec
      # failure, and the OutputDeserializer that would relay its diagnostics
      # never runs. Re-run the exe on the pass-2 input.json it left behind,
      # show what that input actually asks for, and read the Windows event log
      # for the unhandled-exception record the crash leaves behind.
      - name: Report XAML compiler diagnostics
        if: failure()
        shell: pwsh
        run: |
          $project = 'winui/src/CodexUsageWidget'
          $obj = Join-Path (Resolve-Path $project) 'obj/Release/net8.0-windows10.0.19041.0'
          $exe = "$env:USERPROFILE/.nuget/packages/microsoft.windowsappsdk/1.7.260224002/tools/net472/XamlCompiler.exe"
          $input = Get-Content "$obj/input.json" -Raw | ConvertFrom-Json
          '== pass-2 input.json =='
          foreach ($p in $input.psobject.Properties) {
            $v = $p.Value
            if ($v -is [System.Array]) { "$($p.Name): [$($v.Count)] $($v[0..([Math]::Min(2, $v.Count - 1))] -join ' | ')" }
            else { "$($p.Name): $v" }
          }
          '== obj/ contents =='
          Get-ChildItem $obj -Recurse -File | Sort-Object FullName |
            ForEach-Object { "{0,10} {1}" -f $_.Length, $_.FullName.Substring($obj.Length + 1) }
          '== XamlCompiler.exe =='
          & $exe "$obj/input.json" "$obj/diagnostic-output.json" 2>&1 | ForEach-Object { "$_" }
          "exit code: $LASTEXITCODE"
          if (Test-Path "$obj/diagnostic-output.json") {
            '== diagnostic-output.json =='
            Get-Content "$obj/diagnostic-output.json" -Raw
          }
          '== Application event log =='
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-10) } `
            -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -match '\.NET Runtime|Application Error|Windows Error Reporting' } |
            ForEach-Object { "--- $($_.TimeCreated) $($_.ProviderName) id=$($_.Id)`n$($_.Message)" }
